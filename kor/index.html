<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>미친국어T 연구소 — 국어 모의고사 출제</title>
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif; background: #f5f4fa; color: #16141f; }
.box { background: #fff; border: 1px solid #e7e4f1; border-radius: 16px; padding: 28px 30px; width: min(92vw, 400px); box-shadow: 0 8px 24px -12px rgba(60,42,154,.2); text-align: center; }
.mark { width: 44px; height: 44px; border-radius: 13px; background: linear-gradient(135deg, #7c5cff, #5b3fd1); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; margin: 0 auto 12px; }
h1 { font-size: 17px; margin: 0 0 6px; } p { color: #716d86; font-size: 13px; margin: 0 0 14px; line-height: 1.6; }
a.btn { display: inline-block; border-radius: 10px; padding: 10px 18px; background: linear-gradient(135deg, #7c5cff, #5b3fd1); color: #fff; font-weight: 700; text-decoration: none; font-size: 14px; }
.spin { width: 22px; height: 22px; border: 3px solid #e7e4f1; border-top-color: #5b3fd1; border-radius: 50%; animation: s 1s linear infinite; margin: 0 auto 12px; }
@keyframes s { to { transform: rotate(360deg); } }
.muted { font-size: 12px; color: #9a97ad; margin-top: 14px; }
</style>
</head>
<body>
<div class="box">
  <div class="mark">미</div>
  <h1>미친국어T 연구소 국어 모의고사 출제</h1>
  <div class="spin" id="spin"></div>
  <p id="msg">출제 서버에 연결하는 중…</p>
  <a class="btn" id="go" style="display:none" href="#">출제 화면 열기</a>
  <div class="muted">서버는 연구소 PC 에서 돌아갑니다. 꺼져 있으면 잠시 뒤 다시 열어 주세요.</div>
</div>
<script>
(async () => {
  const msg = document.getElementById("msg"), go = document.getElementById("go"), spin = document.getElementById("spin");
  const api = "https://api.github.com/repos/devil-elora/gayun-engine-beacon/contents/korean.json?ref=main";
  const raw = "https://raw.githubusercontent.com/devil-elora/gayun-engine-beacon/main/korean.json";
  let url = null;
  try {
    const r = await fetch(api, { headers: { Accept: "application/vnd.github.v3+json" }, cache: "no-store" });
    if (r.ok) { const j = await r.json(); url = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))))).url; }
  } catch (e) {}
  if (!url) { try { const r = await fetch(raw + "?t=" + Date.now(), { cache: "no-store" }); if (r.ok) url = (await r.json()).url; } catch (e) {} }
  if (!url) { spin.style.display = "none"; msg.textContent = "주소를 읽지 못했습니다. 잠시 뒤 새로고침해 주세요."; return; }
  // 서버가 살아 있는지 확인한 뒤 이동
  let alive = false;
  try { const r = await fetch(url + "/api/whoami", { cache: "no-store", credentials: "omit" }); alive = r.ok || r.status === 401; } catch (e) {}
  go.href = url;
  if (alive) { msg.textContent = "연결됐습니다. 이동합니다…"; location.replace(url); }
  else { spin.style.display = "none"; msg.textContent = "지금은 출제 서버가 꺼져 있거나 주소가 바뀌는 중입니다(1분 안에 복구). 잠시 뒤 다시 시도해 주세요."; go.style.display = "inline-block"; go.textContent = "그래도 열어 보기"; }
})();
</script>
</body>
</html>
